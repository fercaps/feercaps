<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle del Producto | FEER CAPS</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between;">

<!-- Navbar Simple -->
<header>
<div class="logo-container" style="cursor: pointer;" onclick="window.location.href='index.html'">
<img src="img/logo.png" alt="FEER CAPS Logo" class="logo-img">
<div class="logo">FEER<span>CAPS</span></div>
</div>
<nav class="navbar">
<a href="index.html" style="color: #fff; text-decoration: none; font-weight: bold;"><i class="fa-solid fa-arrow-left"></i> Volver a la Tienda</a>
</nav>
</header>

<!-- Contenedor Principal del Detalle -->
<main style="max-width: 800px; width: 90%; margin: 40px auto; background: rgba(10, 10, 10, 0.95); border: 2px solid #ff0000; border-radius: 20px; padding: 30px; box-shadow: 0 0 40px rgba(255, 0, 0, 0.4);">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; align-items: center;">
  
  <!-- Imagen del Producto con cursor de lupa -->
  <div style="text-align: center; background: #000; border-radius: 12px; padding: 15px; border: 1px solid #333; cursor: pointer;" onclick="abrirZoomDetalle()">
    <img id="detImg" src="" alt="Producto" style="width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px;">
    <p style="font-size: 0.75rem; color: #aaa; margin-top: 8px;"><i class="fa-solid fa-magnifying-glass-plus"></i> Haz clic para ampliar</p>
  </div>

  <!-- Información y Opciones -->
  <div style="display: flex; flex-direction: column; gap: 15px;">
    <h1 id="detTitle" style="font-size: 1.5rem; font-weight: 900; color: #fff; margin: 0;"></h1>
    <p id="detPrice" style="font-size: 1.5rem; font-weight: 800; color: #ff0000; margin: 0;"></p>
    
    <!-- Selector de Talla Dinámico (Aparece solo si es 59FIFTY) -->
    <div id="detTallaContainer" style="display: none;">
      <label style="font-size: 0.85rem; color: #ccc; display: block; margin-bottom: 5px;">Selecciona tu Talla (59FIFTY):</label>
      <select id="detSelectTalla" style="width: 100%; padding: 10px; background: #222; color: white; border: 1px solid #444; border-radius: 8px; font-weight: bold;">
        <option value="7">7 (55.8 cm)</option>
        <option value="7 1/8">7 1/8 (56.8 cm)</option>
        <option value="7 1/4" selected>7 1/4 (57.7 cm)</option>
        <option value="7 3/8">7 3/8 (58.7 cm)</option>
        <option value="7 1/2">7 1/2 (59.6 cm)</option>
        <option value="7 5/8">7 5/8 (60.6 cm)</option>
        <option value="7 3/4">7 3/4 (61.5 cm)</option>
      </select>
    </div>

    <p style="font-size: 0.85rem; color: #aaa; line-height: 1.4;">Producto 100% exclusivo de alta calidad. Envíos seguros a todo el Ecuador y entregas presenciales en Guayaquil.</p>

    <!-- Botón Agregar al Carrito -->
    <button onclick="agregarDesdeDetalle()" style="background-color: #ff0000; color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;">
      <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
    </button>
    
    <button onclick="window.location.href='index.html'" style="background-color: #222; color: #ffffff; border: 1px solid #444; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; cursor: pointer;">
      Ver más productos
    </button>
  </div>

</div>
</main>

<!-- Visor de imagen flotante para hacer Zoom -->
<div id="productImageViewer" class="img-viewer-modal" onclick="cerrarVisorImagen(event)">
    <div class="img-viewer-content" onclick="event.stopPropagation()">
        <button class="img-viewer-close" onclick="cerrarVisorImagenDirecto()">&times;</button>
        <img id="viewerImgTarget" src="" alt="Vista Previa">
        <h3 id="viewerTitleTarget" class="img-viewer-title"></h3>
    </div>
</div>

<!-- Footer -->
<footer>
<p>© 2026 FEER CAPS - Guayaquil, Ecuador</p>
</footer>

<!-- Script para capturar los datos, manejar el carrito y el zoom -->
<script>
    // Leer los parámetros enviados por la URL
    const urlParams = new URLSearchParams(window.location.search);
    const imgUrl = urlParams.get('img');
    const name = urlParams.get('name');
    const price = urlParams.get('price');
    const categoria = urlParams.get('cat');

    // Asignar los valores a los elementos de la página
    document.getElementById('detImg').src = imgUrl || '';
    document.getElementById('detTitle').innerText = name || 'Producto FEER CAPS';
    document.getElementById('detPrice').innerText = '$' + (price || '0.00');

    // Si el producto pertenece a la sección "fifty" (gorras cerradas), mostramos el selector de tallas
    if (categoria === 'fifty') {
        document.getElementById('detTallaContainer').style.display = 'block';
    }

    // Funciones del Visor / Zoom
    function abrirZoomDetalle() {
        const modal = document.getElementById('productImageViewer');
        const viewerImg = document.getElementById('viewerImgTarget');
        const viewerTitle = document.getElementById('viewerTitleTarget');

        if (modal && viewerImg && viewerTitle) {
            viewerImg.src = imgUrl;
            viewerTitle.innerText = name;
            modal.style.display = 'flex';
        }
    }

    function cerrarVisorImagenDirecto() {
        const modal = document.getElementById('productImageViewer');
        if (modal) modal.style.display = 'none';
    }

    function cerrarVisorImagen(event) {
        const modal = document.getElementById('productImageViewer');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }

    function agregarDesdeDetalle() {
        // Recuperar carrito actual de localStorage si existe
        let carritoLocal = JSON.parse(localStorage.getItem('feer_cart')) || [];
        
        let tallaSeleccionada = 'Única';
        if (categoria === 'fifty') {
            tallaSeleccionada = document.getElementById('detSelectTalla').value;
        }

        const precioNum = parseFloat(price) || 19.99;
        const itemId = name + '-' + tallaSeleccionada;
        
        const existing = carritoLocal.find(item => item.id === itemId);
        if (existing) {
            existing.quantity += 1;
        } else {
            carritoLocal.push({
                id: itemId,
                name: name,
                price: precioNum,
                image: imgUrl,
                talla: tallaSeleccionada,
                quantity: 1
            });
        }

        // Guardar de vuelta en localStorage
        localStorage.setItem('feer_cart', JSON.stringify(carritoLocal));
        alert('¡Producto agregado al carrito con éxito!');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
